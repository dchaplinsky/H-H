name: Deploy to GitHub Pages

# The site is plain static files at the repo root, published via the classic
# gh-pages branch (auto-provisioned by GitHub). Every push to main mirrors
# the tree to gh-pages. If the repo's Pages settings are ever switched to
# "GitHub Actions" as the source, replace this job with the
# configure-pages/upload-pages-artifact/deploy-pages chain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
